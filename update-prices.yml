name: Update fuel prices

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут (GitHub может запускать с задержкой)
  workflow_dispatch: {}       # ручной запуск кнопкой Run workflow

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect prices
        run: node scraper/scrape.mjs
      - name: Commit if prices changed
        run: |
          if git diff --quiet prices.json; then
            echo "No changes"
          else
            git config user.name "fuel-bot"
            git config user.email "fuel-bot@users.noreply.github.com"
            git add prices.json
            git commit -m "Update prices"
            git push
          fi
